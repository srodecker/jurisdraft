<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinecta Case Manager — JurisDraft</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css" />
<link rel="stylesheet" href="/app/app.css" />
<script>
    // Apply the saved theme before first paint
    try { document.documentElement.dataset.theme = localStorage.getItem('jd_theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (_) {}
</script>
</head>
<body>
<div id="root"><div style="display:grid;place-items:center;height:100vh;color:var(--text-tertiary)">Loading…</div></div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<input type="file" id="filePicker" multiple class="hidden" />
<script type="module" src="/app/main.js"></script>
<noscript>This app needs JavaScript.</noscript>
</body>
</html>
