<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinecta Case Manager — JurisDraft</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css" />
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', var(--font-sans, system-ui), sans-serif; font-size: 13px; }
    button { font-family: inherit; }
    a { color: var(--accent-primary); }
    .hidden { display: none !important; }

    /* Shell */
    .shell { display: flex; height: 100vh; }
    .rail { width: 216px; min-width: 216px; background: var(--bg-secondary); border-right: 1px solid var(--border-primary); display: flex; flex-direction: column; }
    .brand { padding: 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-primary); }
    .brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--accent-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand h1 { font-size: 14px; margin: 0; font-weight: 700; }
    .brand p { font-size: 10px; margin: 0; color: var(--text-tertiary); }
    .nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav a { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 7px; color: var(--text-secondary); text-decoration: none; font-size: 13px; cursor: pointer; }
    .nav a:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .nav a.active { background: var(--accent-primary-light); color: var(--accent-primary); font-weight: 600; }
    .nav svg { width: 16px; height: 16px; flex-shrink: 0; }
    .nav .count { margin-left: auto; font-size: 10px; font-weight: 700; background: var(--accent-error); color: #fff; border-radius: 9px; padding: 0 6px; line-height: 17px; }
    .rail-foot { margin-top: auto; padding: 10px 8px; border-top: 1px solid var(--border-primary); }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border-primary); background: var(--bg-secondary); flex-shrink: 0; }
    .crumbs { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumbs a { color: var(--text-secondary); text-decoration: none; cursor: pointer; }
    .crumbs a:hover { color: var(--accent-primary); }
    .crumbs b { color: var(--text-primary); }
    .search { margin-left: auto; position: relative; }
    .search input { width: 260px; background: var(--bg-tertiary); border: 1px solid var(--border-primary); border-radius: 8px; padding: 7px 10px 7px 30px; color: var(--text-primary); font-size: 12px; }
    .search svg { position: absolute; left: 9px; top: 8px; width: 14px; height: 14px; color: var(--text-tertiary); }
    .content { flex: 1; overflow-y: auto; padding: 22px 24px 40px; }
    .page { max-width: 1240px; margin: 0 auto; }

    /* Controls */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 7px; border: 1px solid transparent; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
    .btn svg { width: 13px; height: 13px; }
    .btn-primary { background: var(--accent-primary); color: #fff; }
    .btn-primary:hover { background: var(--accent-primary-hover); }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border-primary); }
    .btn-secondary:hover { border-color: var(--accent-primary); }
    .btn-ghost { background: none; color: var(--text-secondary); }
    .btn-ghost:hover { color: var(--accent-primary); background: var(--bg-tertiary); }
    .btn-sm { padding: 4px 9px; font-size: 11px; }
    .btn:disabled { opacity: .55; cursor: default; }
    input.field, select.field, textarea.field { width: 100%; background: var(--bg-tertiary); border: 1px solid var(--border-primary); border-radius: 7px; padding: 7px 9px; color: var(--text-primary); font-size: 12px; font-family: inherit; }
    input.field:focus, select.field:focus, textarea.field:focus { outline: none; border-color: var(--accent-primary); }
    label.lbl { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-tertiary); font-weight: 600; margin-bottom: 4px; }

    /* Cards & text */
    h2.title { font-size: 20px; margin: 0 0 2px; font-weight: 700; }
    .sub { color: var(--text-secondary); font-size: 12px; margin: 0 0 18px; }
    .card { background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: 11px; padding: 16px; margin-bottom: 14px; }
    .card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-tertiary); margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .card h3 .act { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 11px; }
    .grid2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; align-items: start; }
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
    .tile { background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: 11px; padding: 14px 16px; }
    .tile .n { font-size: 26px; font-weight: 700; line-height: 1.1; }
    .tile .l { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }
    .muted { color: var(--text-tertiary); }
    .empty { color: var(--text-tertiary); text-align: center; padding: 22px 10px; font-size: 12px; }

    /* Chips */
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 10.5px; font-weight: 600; white-space: nowrap; background: var(--bg-tertiary); color: var(--text-secondary); }
    .chip.overdue { background: var(--accent-error-light); color: var(--accent-error); }
    .chip.soon { background: var(--accent-warning-light); color: #d97706; }
    .chip.upcoming, .chip.stage { background: var(--accent-primary-light); color: var(--accent-primary); }
    .chip.done { background: var(--accent-success-light); color: var(--accent-success); }

    /* Lists */
    .row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--border-secondary); }
    .row:last-child { border-bottom: none; }
    .row .grow { flex: 1; min-width: 0; }
    .row .t { font-weight: 600; font-size: 12.5px; }
    .row .d { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    .clickable { cursor: pointer; }
    .clickable:hover { background: var(--bg-tertiary); border-radius: 7px; }
    .date-box { width: 46px; text-align: center; flex-shrink: 0; border-radius: 8px; background: var(--bg-tertiary); padding: 4px 0; }
    .date-box .m { font-size: 9px; text-transform: uppercase; color: var(--text-tertiary); font-weight: 700; }
    .date-box .dd { font-size: 16px; font-weight: 700; }

    /* Table */
    table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tbl th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-tertiary); padding: 9px 12px; border-bottom: 1px solid var(--border-primary); font-weight: 600; }
    .tbl td { padding: 11px 12px; border-bottom: 1px solid var(--border-secondary); vertical-align: middle; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tr.click:hover td { background: var(--bg-tertiary); cursor: pointer; }

    /* Case header */
    .case-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
    .case-head .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
    .case-head .actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .stages { display: flex; gap: 3px; margin: 4px 0 14px; }
    .stages div { flex: 1; text-align: center; font-size: 10px; padding: 6px 4px; background: var(--bg-tertiary); color: var(--text-tertiary); border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stages div.past { background: var(--accent-success-light); color: var(--accent-success); }
    .stages div.cur { background: var(--accent-primary); color: #fff; font-weight: 700; }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border-primary); margin-bottom: 16px; }
    .tabs a { padding: 9px 14px; color: var(--text-secondary); text-decoration: none; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; font-size: 12.5px; }
    .tabs a.active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
    .tabs a .badge { font-size: 10px; background: var(--bg-tertiary); border-radius: 8px; padding: 0 6px; margin-left: 4px; color: var(--text-tertiary); }

    /* Facts */
    .facts { display: grid; grid-template-columns: 140px 1fr; gap: 7px 12px; font-size: 12.5px; margin: 0; }
    .facts dt { color: var(--text-tertiary); }
    .facts dd { margin: 0; word-break: break-word; }
    .facts dd .src { color: var(--text-tertiary); font-size: 10px; margin-left: 6px; }
    .summary { font-size: 13.5px; line-height: 1.6; margin: 0 0 10px; }
    .keyfacts { margin: 0; padding-left: 18px; color: var(--text-secondary); line-height: 1.65; font-size: 12.5px; }

    /* Documents */
    .drop { border: 2px dashed var(--border-primary); border-radius: 11px; padding: 22px; text-align: center; color: var(--text-secondary); cursor: pointer; transition: all .15s; margin-bottom: 14px; }
    .drop:hover, .drop.over { border-color: var(--accent-primary); background: var(--accent-primary-light); color: var(--text-primary); }
    .doc { border: 1px solid var(--border-primary); border-radius: 9px; margin-bottom: 8px; background: var(--bg-secondary); }
    .doc-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
    .doc-head .name { font-weight: 600; font-size: 12.5px; word-break: break-all; }
    .doc-body { padding: 0 12px 12px 50px; font-size: 12.5px; line-height: 1.6; color: var(--text-secondary); }
    .doc-icon { width: 30px; height: 30px; border-radius: 7px; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0; }
    .progress { background: var(--bg-secondary); border: 1px solid var(--accent-primary); border-radius: 9px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; display: flex; align-items: center; gap: 10px; }
    .spin { width: 14px; height: 14px; border: 2px solid var(--border-primary); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Timeline */
    .tl { position: relative; padding-left: 18px; }
    .tl:before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--border-primary); }
    .tl-item { position: relative; padding: 0 0 14px 10px; }
    .tl-item:before { content: ''; position: absolute; left: -17px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-primary); border: 2px solid var(--bg-secondary); }
    .tl-item.fromdoc:before { background: var(--accent-success); }
    .tl-item .when { font-size: 11px; color: var(--text-tertiary); }
    .tl-item .what { font-weight: 600; font-size: 12.5px; margin: 1px 0; }
    .tl-item .why { font-size: 12px; color: var(--text-secondary); }

    /* Forms */
    .forms-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .form-card { border: 1px solid var(--border-primary); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--bg-secondary); }
    .form-card.suggest { border-color: var(--accent-primary); box-shadow: 0 0 0 1px var(--accent-primary) inset; }
    .form-card .code { font-size: 10px; font-weight: 700; color: var(--accent-primary); letter-spacing: .05em; }
    .form-card .nm { font-weight: 600; font-size: 13px; }
    .form-card .pp { font-size: 11.5px; color: var(--text-tertiary); flex: 1; }
    .kv { display: grid; grid-template-columns: minmax(150px, 34%) 1fr; gap: 6px 14px; font-size: 12px; }
    .kv div { word-break: break-word; }
    .kv div:nth-child(even) { white-space: pre-line; }
    .kv div:nth-child(odd) { color: var(--text-tertiary); }

    /* Chat */
    .chat { display: flex; flex-direction: column; height: calc(100vh - 290px); min-height: 380px; background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: 11px; }
    .chat.full { height: calc(100vh - 160px); }
    .chat-msgs { flex: 1; overflow-y: auto; padding: 18px; }
    .msg { display: flex; gap: 10px; margin-bottom: 16px; max-width: 900px; }
    .msg .av { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .msg.user .av { background: var(--bg-tertiary); color: var(--text-secondary); }
    .msg.ai .av { background: var(--accent-primary); color: #fff; }
    .bubble { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; padding-top: 4px; min-width: 0; }
    .msg.user .bubble { color: var(--text-secondary); }
    .bubble .li { display: flex; gap: 7px; }
    .bubble .li b.dot { color: var(--accent-primary); }
    .form-chip { display: inline-flex; align-items: center; gap: 7px; margin: 6px 6px 0 0; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--accent-primary); background: var(--accent-primary-light); color: var(--accent-primary); font-weight: 600; font-size: 12px; cursor: pointer; white-space: normal; text-align: left; }
    .chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border-primary); }
    .chat-input textarea { flex: 1; resize: none; min-height: 40px; max-height: 140px; background: var(--bg-tertiary); border: 1px solid var(--border-primary); border-radius: 9px; padding: 10px 12px; color: var(--text-primary); font: inherit; font-size: 13px; }
    .chat-input textarea:focus { outline: none; border-color: var(--accent-primary); }
    .suggests { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
    .typing { display: flex; gap: 4px; padding: 10px 0; align-items: center; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary); animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
    .typing em { margin-left: 8px; font-size: 11px; color: var(--text-tertiary); font-style: normal; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

    /* Modal & toast */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 900; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: 12px; width: 100%; max-width: 680px; max-height: 88vh; display: flex; flex-direction: column; }
    .modal-h { padding: 14px 18px; border-bottom: 1px solid var(--border-primary); display: flex; align-items: center; font-weight: 700; font-size: 14px; }
    .modal-b { padding: 16px 18px; overflow-y: auto; }
    .modal-f { padding: 12px 18px; border-top: 1px solid var(--border-primary); display: flex; justify-content: flex-end; gap: 8px; }
    .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .fgrid .full { grid-column: 1 / -1; }
    .section-label { grid-column: 1 / -1; font-weight: 700; font-size: 11px; color: var(--accent-primary); margin-top: 6px; }
    #toasts { position: fixed; bottom: 22px; right: 22px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
    .toast { background: var(--accent-success); color: #fff; padding: 10px 16px; border-radius: 9px; font-size: 12.5px; box-shadow: var(--shadow-lg); max-width: 440px; pointer-events: auto; }
    .toast.err { background: var(--accent-error); }
    .toast.warn { background: #b45309; }
    .warnbox { background: var(--accent-warning-light); color: #b45309; border-radius: 8px; padding: 9px 12px; font-size: 12px; margin-bottom: 12px; }

    /* Login */
    #loginWall { position: fixed; inset: 0; z-index: 9999; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; }
    #loginWall input { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-primary); background: var(--bg-secondary); color: var(--text-primary); font-size: 14px; }

    @media (max-width: 1000px) {
        .grid2, .forms-grid { grid-template-columns: 1fr; }
        .tiles { grid-template-columns: repeat(2, 1fr); }
        .rail { width: 60px; min-width: 60px; }
        .rail .lbl-t, .brand > div:last-child { display: none; }
        .search input { width: 160px; }
        .stages div { font-size: 0; padding: 4px; }
        .case-head { flex-direction: column; }
        .case-head .actions { margin-left: 0; justify-content: flex-start; }
    }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginWall" class="hidden">
    <div style="width:100%;max-width:380px;padding:32px;">
        <div style="text-align:center;margin-bottom:28px;">
            <div class="brand-mark" style="width:56px;height:56px;border-radius:16px;margin:0 auto 16px;"><svg width="28" height="28" viewBox="0 0 100 100" fill="none"><rect x="35" y="20" width="8" height="50" rx="4" fill="white"/><rect x="20" y="15" width="38" height="12" rx="6" fill="white"/><rect x="20" y="15" width="12" height="25" rx="6" fill="white"/><rect x="10" y="65" width="60" height="12" rx="6" fill="white"/><rect x="10" y="65" width="12" height="20" rx="6" fill="white"/></svg></div>
            <h1 style="font-size:22px;margin:0 0 4px;">Kinecta Case Manager</h1>
            <p class="muted" style="margin:0;">Sign in to continue</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
            <input id="loginUser" placeholder="Username" autocomplete="username" />
            <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()" />
            <div id="loginError" style="color:var(--accent-error);font-size:12px;" class="hidden"></div>
            <button id="loginBtn" class="btn btn-primary" style="justify-content:center;padding:10px;font-size:14px;" onclick="signIn()">Sign In</button>
        </div>
    </div>
</div>

<!-- ============ APP ============ -->
<div class="shell hidden" id="app">
    <nav class="rail">
        <div class="brand">
            <div class="brand-mark"><svg width="18" height="18" viewBox="0 0 100 100" fill="none"><rect x="35" y="20" width="8" height="50" rx="4" fill="white"/><rect x="20" y="15" width="38" height="12" rx="6" fill="white"/><rect x="20" y="15" width="12" height="25" rx="6" fill="white"/><rect x="10" y="65" width="60" height="12" rx="6" fill="white"/><rect x="10" y="65" width="12" height="20" rx="6" fill="white"/></svg></div>
            <div><h1>JurisDraft</h1><p>Kinecta Case Manager</p></div>
        </div>
        <div class="nav">
            <a data-nav="today" href="#/today"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><span class="lbl-t">Today</span><span class="count hidden" id="navOverdue" title="Overdue items"></span></a>
            <a data-nav="cases" href="#/cases"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg><span class="lbl-t">Cases</span></a>
            <a data-nav="assistant" href="#/assistant"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg><span class="lbl-t">Assistant</span></a>
            <a data-nav="forms" href="#/forms"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span class="lbl-t">Forms</span></a>
            <a href="/full"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg><span class="lbl-t">Doc Generator</span></a>
        </div>
        <div class="rail-foot">
            <div class="nav" style="padding:0;">
                <a onclick="signOut()"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg><span class="lbl-t">Sign out <span id="whoami" class="muted"></span></span></a>
            </div>
        </div>
    </nav>
    <div class="main">
        <div class="topbar">
            <div class="crumbs" id="crumbs"></div>
            <div class="search">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input id="caseSearch" list="caseList" placeholder="Jump to case — name or case #" onkeydown="if(event.key==='Enter')jumpToCase(this.value)" onchange="jumpToCase(this.value)" />
                <datalist id="caseList"></datalist>
            </div>
            <button class="btn btn-primary" onclick="openNewCase()"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>New case</button>
        </div>
        <div class="content" id="content"><div class="page" id="view"></div></div>
    </div>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>
<input type="file" id="filePicker" multiple class="hidden" />

<script>
// ============================================================
// AUTH
// ============================================================
const TOKEN_KEY = 'jd_token';
const USER_KEY = 'jd_username';
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY); } catch (_) { return null; } };
const authHeaders = () => (getToken() ? { Authorization: 'Bearer ' + getToken() } : {});

function showLogin() { document.getElementById('loginWall').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }
function showApp() { document.getElementById('loginWall').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); }

async function signIn() {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    if (!u || !p) { err.textContent = 'Enter username and password.'; err.classList.remove('hidden'); return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
        const d = await r.json();
        if (r.ok && d.token) {
            localStorage.setItem(TOKEN_KEY, d.token);
            localStorage.setItem(USER_KEY, d.username || u);
            location.reload();
            return;
        }
        err.textContent = d.error || 'Invalid credentials.'; err.classList.remove('hidden');
    } catch (_) {
        err.textContent = 'Network error. Please try again.'; err.classList.remove('hidden');
    } finally { btn.disabled = false; btn.textContent = 'Sign In'; }
}

async function signOut() {
    try { await authFetch('/api/logout', { method: 'POST' }); } catch (_) {}
    localStorage.removeItem(TOKEN_KEY);
    showLogin();
}

async function authFetch(url, opts = {}) {
    opts.headers = { ...authHeaders(), ...(opts.headers || {}) };
    const res = await fetch(url, opts);
    if (res.status === 401) {
        try {
            const check = await (await fetch('/api/auth-status', { headers: authHeaders() })).json();
            if (check.authenticated) { const retry = await fetch(url, opts); if (retry.status !== 401) return retry; }
        } catch (_) {}
        localStorage.removeItem(TOKEN_KEY);
        showLogin();
        throw new Error('Session expired');
    }
    return res;
}

// JSON request helper; throws with the server's error message
async function api(url, opts = {}) {
    if (opts.json !== undefined) {
        opts.method = opts.method || 'POST';
        opts.headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
        opts.body = JSON.stringify(opts.json);
        delete opts.json;
    }
    const r = await authFetch(url, opts);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(d.error || `Request failed (${r.status})`); e.data = d; throw e; }
    return d;
}

// ============================================================
// UTILITIES
// ============================================================
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function attr(s) { return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'toast' + (kind === true || kind === 'err' ? ' err' : kind === 'warn' ? ' warn' : '');
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), kind ? 7000 : 3500);
}
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseISO(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function fmtDate(s) { const d = parseISO(s); return d ? `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` : (s || '—'); }
function fmtMoney(v) { const n = parseFloat(String(v || '').replace(/[^0-9.]/g, '')); return isNaN(n) ? (v || '') : '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function relDays(n) { if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; if (n === -1) return 'yesterday'; return n < 0 ? `${-n} days ago` : `in ${n} days`; }
function dateBox(s) { const d = parseISO(s); return d ? `<div class="date-box"><div class="m">${MONTHS[d.getMonth()]}</div><div class="dd">${d.getDate()}</div></div>` : ''; }
function statusChip(st) { const t = { overdue: 'Overdue', soon: 'Due soon', upcoming: 'Upcoming', done: 'Done' }[st] || st; return `<span class="chip ${st}">${t}</span>`; }
function formatBytes(n) { if (!n) return ''; if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(0) + ' KB'; return (n / 1048576).toFixed(1) + ' MB'; }
// "[VAR_DEFENDANT_NAME_ET_AL]" → "Defendant name et al"
function varLabel(v) { const t = String(v).replace(/^\[|\]$/g, '').replace(/^VAR_/, '').replace(/_/g, ' ').toLowerCase(); return t.charAt(0).toUpperCase() + t.slice(1); }
function caseLabel(c) { return `${c.debtorName || 'Unnamed'}${c.caseNumber ? ' · ' + c.caseNumber : ''}`; }

// AI text: escape, then bold, headings, bullets, and [[form:case:form|label]] buttons
function formatAi(text) {
    let h = esc(text);
    h = h.replace(/\[\[form:([0-9a-f-]{36}):([0-9a-f-]{36})\|([^\]]+)\]\]/g, (_, c, f, l) =>
        `<button class="form-chip" onclick="showForm('${c}','${f}')">📄 ${l}</button>`);
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/^#{1,4} (.+)$/gm, '<strong>$1</strong>');
    h = h.replace(/^\s*[-•*] (.+)$/gm, '<span class="li"><b class="dot">•</b><span>$1</span></span>');
    return h;
}

// Open a prepared form in a new tab, or download it
async function openForm(caseId, formId, inline) {
    const w = inline ? window.open('', '_blank') : null;
    try {
        const r = await authFetch(`/api/cases/${caseId}/forms/${formId}/download${inline ? '?inline=1' : ''}`);
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Could not open form');
        if ((r.headers.get('content-type') || '').includes('application/json')) {
            const { url } = await r.json();
            if (w) w.location = url; else window.location.href = url;
            return;
        }
        const blob = await r.blob();
        const href = URL.createObjectURL(blob);
        if (w) { w.location = href; return; }
        const name = (r.headers.get('content-disposition') || '').match(/filename="?([^"]+)"?/);
        const a = document.createElement('a');
        a.href = href; a.download = name ? decodeURIComponent(name[1]) : 'form';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(href), 20000);
    } catch (e) {
        if (w) w.close();
        toast(e.message, true);
    }
}

// ============================================================
// STATE & ROUTER
// ============================================================
const state = { cases: [], forms: [], caseView: null, caseId: null, tab: 'overview', busy: {}, progress: '' };
const TABS = [['overview', 'Overview'], ['documents', 'Documents'], ['timeline', 'Timeline'], ['forms', 'Forms'], ['assistant', 'Ask AI']];

function setCrumbs(parts) {
    document.getElementById('crumbs').innerHTML = parts.map((p, i) => i === parts.length - 1 ? `<b>${esc(p[0])}</b>` : `<a href="${p[1]}">${esc(p[0])}</a>`).join(' <span class="muted">/</span> ');
}
function setNav(key) { document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === key)); }

async function route() {
    const [, page, id, tab] = (location.hash || '#/today').split('/');
    const view = document.getElementById('view');
    closeModal();
    if (page === 'case' && id) {
        setNav('cases');
        await showCase(id, tab || 'overview');
        return;
    }
    state.caseId = null;
    state.caseView = null;
    if (page === 'cases') { setNav('cases'); setCrumbs([['Cases']]); await renderCases(view); }
    else if (page === 'assistant') { setNav('assistant'); setCrumbs([['Assistant']]); renderAssistant(view); }
    else if (page === 'forms') { setNav('forms'); setCrumbs([['Forms']]); await renderFormsCatalog(view); }
    else { setNav('today'); setCrumbs([['Today']]); await renderToday(view); }
    document.getElementById('content').scrollTop = 0;
}
window.addEventListener('hashchange', route);

function applyCases(list) {
    state.cases = list || [];
    document.getElementById('caseList').innerHTML = state.cases.map(c => `<option value="${attr(caseLabel(c))}">`).join('');
    const overdue = state.cases.reduce((n, c) => n + (c.overdueCount || 0), 0);
    const badge = document.getElementById('navOverdue');
    badge.textContent = overdue; badge.classList.toggle('hidden', !overdue);
}
async function loadCases() {
    try { applyCases(await api('/api/cases')); } catch (_) { /* keep last list */ }
    return state.cases;
}

function jumpToCase(q) {
    q = String(q || '').toLowerCase().trim();
    if (!q) return;
    const c = state.cases.find(x => caseLabel(x).toLowerCase() === q)
        || state.cases.find(x => (x.caseNumber || '').toLowerCase() === q)
        || state.cases.find(x => caseLabel(x).toLowerCase().includes(q));
    if (c) { document.getElementById('caseSearch').value = ''; location.hash = `#/case/${c.id}/overview`; }
    else toast('No case matches "' + q + '"', true);
}

// ============================================================
// TODAY
// ============================================================
async function renderToday(view) {
    view.innerHTML = `<div class="empty">Loading…</div>`;
    let d;
    try { d = await api('/api/dashboard/today'); } catch (e) { view.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    applyCases(d.cases);
    const overdue = d.attention.filter(a => a.status === 'overdue').length;
    const soon = d.attention.filter(a => a.status === 'soon').length;
    const active = d.cases.filter(c => c.status !== 'closed').length;
    const hour = new Date().getHours();
    const hello = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    const stageRow = d.stages.map(s => `<div class="row"><span class="grow">${esc(s.label)}</span><b>${d.pipeline[s.key] || 0}</b></div>`).join('');
    view.innerHTML = `
        <h2 class="title">${hello}</h2>
        <p class="sub">${fmtDate(d.today)} · ${active} active case${active === 1 ? '' : 's'}</p>
        <div class="tiles">
            <div class="tile"><div class="n" style="color:var(--accent-error)">${overdue}</div><div class="l">Overdue</div></div>
            <div class="tile"><div class="n" style="color:#d97706">${soon}</div><div class="l">Due in the next 7 days</div></div>
            <div class="tile"><div class="n" style="color:var(--accent-primary)">${d.hearings.length}</div><div class="l">Hearings in the next 60 days</div></div>
            <div class="tile"><div class="n">${active}</div><div class="l">Active cases</div></div>
        </div>
        <div class="card" style="display:flex;gap:8px;align-items:center;padding:10px 14px;">
            <svg width="18" height="18" fill="none" stroke="var(--accent-primary)" viewBox="0 0 24 24" style="flex-shrink:0"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            <input class="field" id="quickAsk" placeholder="Ask about any case or give an instruction — e.g. “prepare the request for default for Acevedo”" onkeydown="if(event.key==='Enter')quickAsk()" style="border:none;background:none;font-size:13px;" />
            <button class="btn btn-primary" onclick="quickAsk()">Ask</button>
        </div>
        <div class="grid2">
            <div>
                <div class="card"><h3>Needs attention <span class="act muted">overdue, and due within 14 days</span></h3>
                    ${d.attention.length ? d.attention.map(a => `
                        <div class="row clickable" onclick="location.hash='#/case/${a.caseId}/overview'">
                            ${dateBox(a.date)}
                            <div class="grow"><div class="t">${esc(a.title)}</div><div class="d">${esc(a.caseLabel)} · ${relDays(a.daysAway)} · ${esc(a.rule)}</div></div>
                            ${statusChip(a.status)}
                            ${a.form ? `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();prepareForm('${a.caseId}','${attr(a.form)}')">Prepare</button>` : ''}
                        </div>`).join('') : '<div class="empty">Nothing overdue or due in the next two weeks.</div>'}
                </div>
                <div class="card" style="padding:12px 6px 6px"><h3 style="padding:0 10px">Cases</h3>${casesTable(d.cases.slice(0, 10))}
                    ${d.cases.length > 10 ? `<div style="text-align:center;margin:8px 0"><a href="#/cases">All ${d.cases.length} cases →</a></div>` : ''}</div>
            </div>
            <div>
                <div class="card"><h3>Upcoming hearings</h3>
                    ${d.hearings.length ? d.hearings.map(h => `<div class="row clickable" onclick="location.hash='#/case/${h.caseId}/overview'">${dateBox(h.date)}<div class="grow"><div class="t">${esc(h.type || 'Hearing')}</div><div class="d">${esc(h.caseLabel)}${h.time ? ' · ' + esc(h.time) : ''}${h.department ? ' · ' + esc(h.department) : ''}</div></div><span class="chip">${relDays(h.daysAway)}</span></div>`).join('') : '<div class="empty">No hearings in the next 60 days.</div>'}
                </div>
                <div class="card"><h3>Pipeline</h3>${stageRow}</div>
                <div class="card"><h3>Recently added documents</h3>
                    ${d.recentDocs.length ? d.recentDocs.map(x => `<div class="row clickable" onclick="location.hash='#/case/${x.caseId}/documents'"><div class="grow"><div class="t" style="font-weight:500">${esc(x.fileName)}</div><div class="d">${esc(x.caseLabel)}${x.documentType ? ' · ' + esc(x.documentType) : ''}</div></div>${x.analysisStatus === 'done' ? '<span class="chip done">Read</span>' : '<span class="chip soon">Not read</span>'}</div>`).join('') : '<div class="empty">No documents yet.</div>'}
                </div>
            </div>
        </div>`;
}

function quickAsk() {
    const q = document.getElementById('quickAsk').value.trim();
    if (!q) return;
    state.pendingAsk = q;
    location.hash = '#/assistant';
}

// ============================================================
// CASES
// ============================================================
function casesTable(list) {
    if (!list.length) return `<div class="empty">No cases yet. Click <b>New case</b>, then drop the case documents in.</div>`;
    return `<table class="tbl"><thead><tr><th>Debtor</th><th>Case #</th><th>Court</th><th>Stage</th><th>Next deadline</th><th>Docs</th></tr></thead><tbody>
        ${list.map(c => `<tr class="click" onclick="location.hash='#/case/${c.id}/overview'">
            <td><b>${esc(c.debtorName || 'Unnamed')}</b>${c.demandAmount ? `<div class="muted" style="font-size:11px">${esc(fmtMoney(c.demandAmount))}</div>` : ''}</td>
            <td>${esc(c.caseNumber || '—')}</td>
            <td style="max-width:200px">${esc(c.courtCounty ? c.courtCounty + ' County' : (c.courtName || '—'))}</td>
            <td><span class="chip stage">${esc(c.stage.label)}</span></td>
            <td>${c.nextDeadline ? `${statusChip(c.nextDeadline.status)} <span style="font-size:11px">${esc(c.nextDeadline.title)} · ${fmtDate(c.nextDeadline.date)}</span>` : '<span class="muted">—</span>'}</td>
            <td>${c.docCount}${c.unreadDocCount ? ` <span class="chip soon" title="Not read yet">${c.unreadDocCount} new</span>` : ''}</td>
        </tr>`).join('')}</tbody></table>`;
}

async function renderCases(view) {
    view.innerHTML = `<div class="empty">Loading…</div>`;
    await loadCases();
    view.innerHTML = `
        <div style="display:flex;align-items:flex-end;margin-bottom:14px;gap:10px"><div><h2 class="title">Cases</h2><p class="sub" style="margin:0">${state.cases.length} case${state.cases.length === 1 ? '' : 's'}</p></div>
            <input class="field" style="margin-left:auto;width:260px" placeholder="Filter by name, case #, court, stage…" oninput="filterCases(this.value)" /></div>
        <div class="card" style="padding:4px" id="casesTable">${casesTable(state.cases)}</div>`;
}
function filterCases(q) {
    q = q.toLowerCase();
    document.getElementById('casesTable').innerHTML = casesTable(state.cases.filter(c => `${c.debtorName} ${c.caseNumber} ${c.courtName} ${c.courtCounty} ${c.stage.label}`.toLowerCase().includes(q)));
}

function openNewCase() {
    modal('New case', `
        <div class="fgrid">
            <div class="full"><label class="lbl">Debtor / defendant name *</label><input class="field" id="ncName" placeholder="e.g. Erick Alonso Acevedo" onkeydown="if(event.key==='Enter')createCase()" /></div>
            <div class="full"><label class="lbl">Case number (if filed)</label><input class="field" id="ncNumber" onkeydown="if(event.key==='Enter')createCase()" /></div>
            <div class="full muted" style="font-size:12px">Everything else is filled in from the documents you upload.</div>
        </div>`, `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createCase()">Create case</button>`);
    setTimeout(() => document.getElementById('ncName').focus(), 50);
}
async function createCase() {
    const name = document.getElementById('ncName').value.trim();
    if (!name) return toast('Enter the debtor name', true);
    try {
        const m = await api('/api/cases', { json: { debtorName: name, caseNumber: document.getElementById('ncNumber').value.trim() } });
        closeModal();
        await loadCases();
        location.hash = `#/case/${m.id}/documents`;
    } catch (e) { toast(e.message, true); }
}

// ============================================================
// CASE WORKSPACE
// ============================================================
async function loadCaseView(id) {
    const v = await api(`/api/cases/${id}`);
    if (state.caseId === id || !state.caseId) { state.caseView = v; state.caseId = id; }
    return v;
}

async function showCase(id, tab) {
    const view = document.getElementById('view');
    if (state.caseId !== id || !state.caseView) {
        state.caseId = id;
        state.caseView = null;
        view.innerHTML = `<div class="empty">Loading case…</div>`;
        try { await loadCaseView(id); } catch (e) { view.innerHTML = `<div class="empty">Case not found. <a href="#/cases">Back to cases</a></div>`; return; }
    }
    state.tab = TABS.some(t => t[0] === tab) ? tab : 'overview';
    view.innerHTML = `<div id="caseHeader"></div><div id="caseProgress"></div><div id="tabBody"></div>`;
    renderCaseHeader();
    renderProgress();
    renderTab();
    document.getElementById('content').scrollTop = 0;
}

function renderCaseHeader() {
    const el = document.getElementById('caseHeader');
    if (!el || !state.caseView) return;
    const v = state.caseView;
    const m = v.matter;
    setCrumbs([['Cases', '#/cases'], [m.debtorName || 'Case']]);
    const stageIdx = v.stage.step;
    const counts = { documents: v.documents.length, forms: (m.generatedForms || []).length, timeline: (m.events || []).filter(e => e.title).length };
    const court = [m.courtBranch || m.courtName, m.courtCounty ? m.courtCounty + ' County' : ''].filter(Boolean).join(' · ');
    el.innerHTML = `
        <div class="case-head">
            <div style="min-width:0">
                <h2 class="title">${esc(m.debtorName || 'Unnamed case')} ${m.status === 'closed' ? '<span class="chip">Closed</span>' : ''}</h2>
                <div class="meta">
                    <span>Case # <b>${esc(m.caseNumber || 'not filed')}</b></span>
                    ${court ? `<span>${esc(court)}</span>` : ''}
                    ${m.creditorName ? `<span>Plaintiff: ${esc(m.creditorName)}</span>` : ''}
                    ${m.demandAmount ? `<span>Demand <b>${esc(fmtMoney(m.demandAmount))}</b></span>` : ''}
                    ${m.judgmentAmount ? `<span>Judgment <b>${esc(fmtMoney(m.judgmentAmount))}</b></span>` : ''}
                </div>
            </div>
            <div class="actions">
                <button class="btn btn-secondary" onclick="pickFiles()"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>Upload</button>
                <button class="btn btn-secondary" onclick="openEditFacts()">Edit facts</button>
                <button class="btn btn-secondary" id="refreshBtn" ${state.busy.refresh ? 'disabled' : ''} onclick="refreshFromDocuments()" title="Read any new documents and update the case from all documents">Refresh from documents</button>
                <a class="btn btn-primary" href="#/case/${m.id}/assistant">Ask AI</a>
            </div>
        </div>
        <div class="stages">${v.stages.map((s, i) => `<div class="${v.stage.key === 'closed' || i < stageIdx ? 'past' : i === stageIdx ? 'cur' : ''}" title="${attr(s.label)}">${esc(s.label)}</div>`).join('')}</div>
        <div class="tabs">${TABS.map(([k, l]) => `<a class="${state.tab === k ? 'active' : ''}" href="#/case/${m.id}/${k}">${l}${counts[k] ? `<span class="badge">${counts[k]}</span>` : ''}</a>`).join('')}</div>`;
}

function renderTab() {
    const body = document.getElementById('tabBody');
    if (!body || !state.caseView) return;
    ({ overview: renderOverview, documents: renderDocuments, timeline: renderTimeline, forms: renderCaseForms, assistant: renderCaseAssistant }[state.tab] || renderOverview)(body);
}

// Reload the open case; keep a live chat in place
async function reloadCase(caseId = state.caseId) {
    if (!caseId || state.caseId !== caseId) return;
    try { await loadCaseView(caseId); } catch (_) { return; }
    if (!location.hash.startsWith(`#/case/${caseId}`)) return;
    renderCaseHeader();
    if (state.tab !== 'assistant') renderTab();
    loadCases();
}

// ---------- Overview ----------
function factRow(label, value, field) {
    const m = state.caseView.matter;
    const src = field && m.fieldSources && m.fieldSources[field];
    const edited = field && m.factOverrides && m.factOverrides[field] !== undefined;
    return `<dt>${label}</dt><dd>${value ? esc(value) : '<span class="muted">—</span>'}${edited ? '<span class="src">edited</span>' : src ? `<span class="src" title="From ${attr(src)}">📄 ${esc(src)}</span>` : ''}</dd>`;
}

function renderOverview(body) {
    const v = state.caseView;
    const m = v.matter;
    const d = m.dates || {};

function getFact(m, key) { return String(key.startsWith('dates.') ? (m.dates || {})[key.slice(6)] || '' : m[key] || '').slice(0, key.startsWith('dates.') ? 10 : undefined); }
function openEditFacts() {
    const m = state.caseView.matter;
    const inner = FACT_FIELDS.map(([k, l]) => l === null ? `<div class="section-label">${k}</div>` :
        `<div><label class="lbl">${l}</label><input class="field" data-fact="${k}" type="${k.startsWith('dates.') ? 'date' : 'text'}" value="${attr(getFact(m, k))}" /></div>`).join('');
    modal('Edit case facts', `<p class="muted" style="margin-top:0;font-size:12px">Your corrections are kept when the case is refreshed from documents. Clear a field to go back to what the documents say.</p><div class="fgrid">${inner}</div>`,
        `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveFacts()">Save</button>`);
}
async function saveFacts() {
    const m = state.caseView.matter;
    const updates = {};
    document.querySelectorAll('[data-fact]').forEach(i => { if (i.value !== getFact(m, i.dataset.fact)) updates[i.dataset.fact] = i.value; });
    if (!Object.keys(updates).length) return closeModal();
    try {
        const r = await api(`/api/cases/${m.id}/facts`, { method: 'PATCH', json: { updates } });
        closeModal();
        state.caseView = { matter: r.matter, summary: r.summary, stage: r.stage, stages: r.stages, deadlines: r.deadlines, documents: r.documents };
        renderCaseHeader();
        renderTab();
        loadCases();
        toast(`Saved ${r.changed.length} change${r.changed.length === 1 ? '' : 's'}${r.rejected.length ? ' — skipped: ' + r.rejected.join(', ') : ''}`, r.rejected.length ? 'warn' : undefined);
    } catch (e) { toast(e.message, true); }
}

// ---------- Documents ----------
function docStatus(x) {
    if (state.busy[x.id]) return '<span class="chip upcoming">Reading…</span>';
    if (x.analysisStatus === 'done') return '<span class="chip done">Read</span>';
    if (x.analysisStatus === 'unsupported') return `<span class="chip" title="${attr(x.analysisError || '')}">Not readable</span>`;
    if (x.analysisStatus === 'error') return `<span class="chip overdue" title="${attr(x.analysisError || '')}">${/missing|not found/i.test(x.analysisError || '') ? 'File missing' : 'Error'}</span>`;
    return '<span class="chip soon">Not read yet</span>';
}
function docIcon(name) { const ext = String(name).split('.').pop().toUpperCase().slice(0, 4); return `<div class="doc-icon">${esc(ext)}</div>`; }

function renderDocuments(body) {
    const v = state.caseView;

                    ${docStatus(x)}
                    <button class="btn btn-ghost btn-sm" title="Rename" onclick="event.stopPropagation();renameDoc('${x.id}')">Rename</button>

                </div>

                    ${(x.keyFacts || []).length ? `<ul class="keyfacts">${x.keyFacts.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}

function toggleDoc(id) { const b = document.getElementById('docbody-' + id); if (b) b.classList.toggle('hidden'); }

async function renameDoc(id) {
    const doc = state.caseView.documents.find(d => d.id === id);
    const name = prompt('Rename document', doc ? doc.fileName : '');
    if (!name || !doc || name === doc.fileName) return;
    try { await api(`/api/matters/${state.caseId}/documents/${id}`, { method: 'PATCH', json: { fileName: name } }); await reloadCase(); } catch (e) { toast(e.message, true); }
}
async function removeDoc(id) {
    const doc = state.caseView.documents.find(d => d.id === id);
    if (!doc || !confirm(`Remove "${doc.fileName}" from this case? Click “Refresh from documents” afterwards to update the facts.`)) return;
    try { await api(`/api/matters/${state.caseId}/documents/${id}`, { method: 'DELETE' }); toast('Removed'); await reloadCase(); } catch (e) { toast(e.message, true); }
}
async function downloadDoc(id) {
    const w = window.open('', '_blank');
    try {
        const r = await authFetch(`/api/matters/${state.caseId}/documents/${id}/download`);
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Could not open');
        if ((r.headers.get('content-type') || '').includes('application/json')) { w.location = (await r.json()).url; return; }
        w.location = URL.createObjectURL(await r.blob());
    } catch (e) { w.close(); toast(e.message, true); }
}

// ---------- Upload → read once → refresh the case ----------
function pickFiles() {
    if (!state.caseId) return toast('Open a case first', true);
    const p = document.getElementById('filePicker');
    p.onchange = () => { const files = [...p.files]; p.value = ''; uploadFiles(files); };
    p.click();
}
function bindDrop(el) {
    if (!el) return;
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => { e.preventDefault(); e.stopPropagation(); el.classList.remove('over'); uploadFiles([...e.dataTransfer.files]); });
}
// Files dropped anywhere on a case page go to that case
window.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => {
    if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault();
    if (state.caseId && location.hash.startsWith('#/case/')) uploadFiles([...e.dataTransfer.files]);
    else toast('Open a case first, then drop its documents', true);
});

function setProgress(html) { state.progress = html || ''; renderProgress(); }
function renderProgress() {
    const el = document.getElementById('caseProgress');
    if (el) el.innerHTML = state.progress ? `<div class="progress"><div class="spin"></div><div>${state.progress}</div></div>` : '';
}

function xhrSend(method, url, body, headers, onProgress) {
    return new Promise((resolve, reject) => {
        const x = new XMLHttpRequest();
        x.open(method, url);
        Object.entries(headers || {}).forEach(([k, v]) => x.setRequestHeader(k, v));
        x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
        x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch (_) {} if (x.status >= 200 && x.status < 300) resolve(d); else reject(new Error(d.error || d.message || `Upload failed (HTTP ${x.status})`)); };
        x.onerror = () => reject(new Error('Network error during upload'));
        x.send(body);
    });
}

async function uploadOne(caseId, file, onProgress) {
    const init = await api(`/api/matters/${caseId}/documents/init`, { json: { fileName: file.name, size: file.size, mimeType: file.type } });
    if (!init.direct) {
        const form = new FormData();
        form.append('files', file);
        await xhrSend('POST', `/api/matters/${caseId}/documents`, form, authHeaders(), onProgress);
        return;
    }
    await xhrSend('PUT', init.signedUrl, file, { 'Content-Type': file.type || 'application/octet-stream', 'x-upsert': 'false', 'cache-control': 'max-age=3600' }, onProgress);
    await api(`/api/matters/${caseId}/documents/complete`, { json: { docId: init.docId, fileName: file.name, mimeType: file.type } });
}

// Read one document into stored text + summary (long scans finish over several requests)
async function readDocumentOnce(caseId, docId) {
    for (let i = 0; i < 4; i++) {
        const d = await api(`/api/matters/${caseId}/documents/${docId}/analyze`, { method: 'POST' });
        if (!d.continue) return d;
    }
    throw new Error('Reading did not finish — try Refresh again');
}

async function uploadFiles(files) {
    const caseId = state.caseId;
    const skipped = files.filter(f => !f.size || f.size > 50 * 1024 * 1024);
    files = files.filter(f => f.size > 0 && f.size <= 50 * 1024 * 1024);
    if (skipped.length) toast(`Skipped ${skipped.map(f => f.name).join(', ')} (empty, a folder, or over 50 MB)`, 'warn');
    if (!caseId || !files.length) return;
    if (state.busy.upload) return toast('An upload is already running', 'warn');
    state.busy.upload = true;
    let ok = 0;
    try {
        for (let i = 0; i < files.length; i++) {
            const label = `Uploading ${i + 1} of ${files.length}: <b>${esc(files[i].name)}</b>`;
            setProgress(label);
            try { await uploadOne(caseId, files[i], p => setProgress(`${label} — ${Math.round(p * 100)}%`)); ok++; }
            catch (e) { toast(`${files[i].name}: ${e.message}`, true); }
        }
    } finally { state.busy.upload = false; setProgress(''); }
    if (!ok) return;
    toast(`Uploaded ${ok} file${ok === 1 ? '' : 's'} — reading now`);
    await reloadCase(caseId);
    await readAndRefresh(caseId);
}

// Read every unread document once, then update the case from all documents
async function readAndRefresh(caseId) {
    if (state.busy.refresh) return;
    state.busy.refresh = true;
    const btn = document.getElementById('refreshBtn');
    if (btn) btn.disabled = true;
    try {
        const docs = state.caseView && state.caseId === caseId ? state.caseView.documents : (await api(`/api/cases/${caseId}`)).documents;
        const pending = docs.filter(d => d.analysisStatus === 'none' || d.analysisStatus === 'error');
        for (let i = 0; i < pending.length; i++) {
            state.busy[pending[i].id] = true;
            setProgress(`Reading ${i + 1} of ${pending.length}: <b>${esc(pending[i].fileName)}</b> — scanned pages take longer`);
            if (state.tab === 'documents' && state.caseId === caseId) renderTab();
            try { await readDocumentOnce(caseId, pending[i].id); } catch (e) { toast(`${pending[i].fileName}: ${e.message}`, true); }
            delete state.busy[pending[i].id];
        }
        setProgress('Updating the case from all documents — facts, dates, deadlines and form data…');
        try {
            await api(`/api/matters/${caseId}/rebuild-from-documents`, { method: 'POST' });
            toast('Case updated from documents');
        } catch (e) {
            toast(e.data && e.data.pending ? `${e.data.pending.length} document(s) still need reading: ${e.message}` : e.message, true);
        }
    } catch (e) {
        toast(e.message, true);
    } finally {
        state.busy.refresh = false;
        setProgress('');
        await reloadCase(caseId);
    }
}
function refreshFromDocuments() {
    if (!state.caseView || !state.caseView.documents.length) return toast('Upload documents first', true);
    readAndRefresh(state.caseId);
}

        <div class="card"><h3>Prepare a form <span class="act muted">filled from this case's documents, your corrections and your firm profile</span></h3>
            <div class="forms-grid">${forms.map(f => `<div class="form-card ${suggest.includes(f.file) ? 'suggest' : ''}">
                <div class="code">${esc(f.code)}${suggest.includes(f.file) ? ' · SUGGESTED NOW' : ''}</div><div class="nm">${esc(f.title)}</div><div class="pp">${esc(f.purpose)}</div>
                <div><button class="btn btn-primary btn-sm" onclick="prepareForm('${m.id}','${attr(f.file)}')">Prepare</button></div></div>`).join('')}</div>
            <p class="muted" style="font-size:11.5px;margin:12px 0 0">Need amounts, costs or other details added? Ask the AI, e.g. “prepare the request for court judgment with costs of $435”.</p>
        </div>`;
}

async function prepareForm(caseId, file) {
    toast('Preparing form…');
    try {
        const rec = await api(`/api/cases/${caseId}/forms`, { json: { form: file } });
        if (state.caseId === caseId) await reloadCase(caseId);
        else loadCases();
        showFormRecord(caseId, rec);
    } catch (e) { toast(e.message, true); }
}

// Show what went into a prepared form, with open / download / delete
async function showForm(caseId, formId) {
    let rec = state.caseId === caseId && state.caseView ? (state.caseView.matter.generatedForms || []).find(f => f.id === formId) : null;
    if (!rec) {
        try { const v = await api(`/api/cases/${caseId}`); rec = (v.matter.generatedForms || []).find(f => f.id === formId); } catch (_) {}
    }
    if (!rec) return toast('That form was deleted', true);
    showFormRecord(caseId, rec);
}
function showFormRecord(caseId, rec) {
    const filled = Object.entries(rec.filled || {});
    const missing = rec.missing || [];
    modal(`${rec.code} — ${rec.title}`, `
        <div class="muted" style="font-size:12px;margin-bottom:12px">Prepared ${fmtDate(String(rec.createdAt).slice(0, 10))} by ${esc(rec.createdBy || '')} · ${rec.filledCount || 0} fields filled</div>
        ${missing.length ? `<div class="warnbox"><b>Blank key fields:</b> ${esc(missing.map(varLabel).join(', '))}<br>Fix them with Edit facts or ask the AI, then prepare the form again.</div>` : ''}
        ${filled.length ? `<div class="kv">${filled.map(([k, v]) => `<div title="${attr(k)}">${esc(varLabel(k))}</div><div>${esc(v)}</div>`).join('')}</div>` : '<div class="muted">Open the form to see its contents.</div>'}
        <p class="muted" style="font-size:11px;margin:14px 0 0">Review before filing.</p>`,
        `<button class="btn btn-ghost" onclick="deleteForm('${caseId}','${rec.id}')">Delete</button><span style="flex:1"></span>
         <button class="btn btn-secondary" onclick="openForm('${caseId}','${rec.id}',false)">Download</button>
         <button class="btn btn-primary" onclick="openForm('${caseId}','${rec.id}',true)">Open ${rec.contentType && rec.contentType.includes('word') ? 'document' : 'PDF'}</button>`);
}
async function deleteForm(caseId, formId) {
    if (!confirm('Delete this prepared form?')) return;
    try { await api(`/api/cases/${caseId}/forms/${formId}`, { method: 'DELETE' }); closeModal(); await reloadCase(caseId); toast('Deleted'); } catch (e) { toast(e.message, true); }
}

async function renderFormsCatalog(view) {
    view.innerHTML = `<div class="empty">Loading…</div>`;
    let forms = [];
    try { forms = await loadForms(); } catch (e) { view.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    view.innerHTML = `<h2 class="title">Forms</h2><p class="sub">Judicial Council and local forms the case manager fills from a case. Open a case and use its Forms tab, or tell the Assistant, e.g. “prepare the abstract of judgment for Acevedo”.</p>
        <div class="forms-grid">${forms.map(f => `<div class="form-card"><div class="code">${esc(f.code)}</div><div class="nm">${esc(f.title)}</div><div class="pp">${esc(f.purpose)}</div><div class="muted" style="font-size:10.5px">Stage: ${esc(f.stage)}</div></div>`).join('')}</div>`;
}

// ============================================================
// ASSISTANT (global and per case)
// ============================================================
const chats = {};
function chatHtml(id, full) {
    return `<div class="chat ${full ? 'full' : ''}"><div class="chat-msgs" id="${id}-msgs"></div>
        <div class="chat-input"><textarea id="${id}-in" rows="1" placeholder="Ask about a case, or tell me what to do (update a fact, add a reminder, prepare a form)…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat('${id}')}"></textarea>
        <button class="btn btn-primary" id="${id}-send" onclick="sendChat('${id}')">Send</button></div></div>`;
}
function renderMessages(id) {
    const c = chats[id];
    const box = document.getElementById(id + '-msgs');
    if (!c || !box) return;
    if (!c.history.length && !c.sending) {
        box.innerHTML = `<div style="text-align:center;padding:40px 10px">
            <div class="brand-mark" style="width:44px;height:44px;margin:0 auto 12px;border-radius:12px"><svg width="22" height="22" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></div>
            <div style="font-weight:700;font-size:15px">${c.caseId ? 'Ask about this case' : 'Kinecta Case Assistant'}</div>
            <div class="muted" style="max-width:500px;margin:6px auto 0">${c.caseId ? 'Answers come from this case\'s documents. I can also correct facts, add reminders and prepare forms.' : 'I know every case and its documents. Ask questions, or tell me to update a case, add a reminder or prepare a form.'}</div>
            <div class="suggests">${c.suggestions.map(s => `<button class="btn btn-secondary btn-sm" onclick="chatSuggest('${id}', this.textContent)">${esc(s)}</button>`).join('')}</div></div>`;
        return;
    }
    box.innerHTML = c.history.map(h => `<div class="msg ${h.role === 'user' ? 'user' : 'ai'}"><div class="av">${h.role === 'user' ? 'You' : 'AI'}</div><div class="bubble">${h.role === 'user' ? esc(h.content) : formatAi(h.content)}</div></div>`).join('')
        + (c.sending ? `<div class="msg ai"><div class="av">AI</div><div class="typing"><span></span><span></span><span></span><em>reading the case file…</em></div></div>` : '');
    box.scrollTop = box.scrollHeight;
}
async function mountChat(id, caseId, suggestions) {
    const prev = chats[id];
    // Keep an in-flight conversation when the tab is re-rendered
    if (prev && prev.caseId === caseId && (prev.sending || prev.loaded)) { prev.suggestions = suggestions; renderMessages(id); return; }
    const c = chats[id] = { caseId, history: [], sending: false, loaded: false, suggestions };
    renderMessages(id);
    try { c.history = await api(`/api/assistant/history${caseId ? '?caseId=' + caseId : ''}`); } catch (_) {}
    c.loaded = true;
    if (chats[id] !== c) return;
    renderMessages(id);
    if (!caseId && state.pendingAsk) { const q = state.pendingAsk; state.pendingAsk = null; document.getElementById(id + '-in').value = q; sendChat(id); }
}
function chatSuggest(id, text) { document.getElementById(id + '-in').value = text; sendChat(id); }
async function sendChat(id) {
    const c = chats[id];
    const input = document.getElementById(id + '-in');
    const msg = input.value.trim();
    if (!msg || !c || c.sending) return;
    input.value = '';
    c.history.push({ role: 'user', content: msg });
    c.sending = true;
    renderMessages(id);
    const btn = document.getElementById(id + '-send');
    if (btn) { btn.disabled = true; btn.textContent = 'Working…'; }
    try {
        const r = await api('/api/assistant', { json: { message: msg, caseId: c.caseId } });
        c.history.push(r.message);
        if (r.changedCases && r.changedCases.length) {
            loadCases();
            if (state.caseId && r.changedCases.includes(state.caseId)) reloadCase(state.caseId);
        }
    } catch (e) {
        c.history.push({ role: 'assistant', content: `Sorry — ${e.message}` });
    } finally {
        c.sending = false;
        renderMessages(id);
        const b = document.getElementById(id + '-send');
        if (b) { b.disabled = false; b.textContent = 'Send'; }
    }
}
async function clearChat(id) {
    const c = chats[id];
    if (!c || !confirm('Clear this conversation?')) return;
    try { await api(`/api/assistant/history${c.caseId ? '?caseId=' + c.caseId : ''}`, { method: 'DELETE' }); c.history = []; renderMessages(id); } catch (e) { toast(e.message, true); }
}
function renderAssistant(view) {
    view.innerHTML = `<div style="display:flex;align-items:center;margin-bottom:10px"><div><h2 class="title">Assistant</h2><p class="sub" style="margin:0">Knows every case and its documents · can update cases, add reminders and prepare forms</p></div><button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="clearChat('g')">Clear conversation</button></div>${chatHtml('g', true)}`;
    mountChat('g', null, ['What needs my attention today?', 'Which cases are ready for a default request?', 'Summarize every active case', 'What hearings are coming up?']);
}
function renderCaseAssistant(body) {
    const m = state.caseView.matter;
    body.innerHTML = `<div style="display:flex;justify-content:flex-end;margin:-6px 0 6px"><button class="btn btn-ghost btn-sm" onclick="clearChat('c')">Clear conversation</button></div>${chatHtml('c', false)}`;
    const suggestions = ['Summarize this case', 'What is the next step and its deadline?', 'When and how was the defendant served?'];
    const s = state.caseView.stage.key;
    if (s === 'intake') suggestions.push('Prepare the summons');
    if (s === 'default_window') suggestions.push('Prepare the request for entry of default');
    if (s === 'default_entered') suggestions.push('Prepare the request for court judgment');
    if (s === 'judgment') suggestions.push('Prepare the abstract of judgment');
    mountChat('c', m.id, suggestions);
}

// ============================================================
// MODAL
// ============================================================
function modal(title, bodyHtml, footHtml) {
    document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h">${esc(title)}<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="closeModal()">✕</button></div><div class="modal-b">${bodyHtml}</div><div class="modal-f">${footHtml}</div></div></div>`;
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ============================================================
// START
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
    if (!getToken()) return showLogin();
    try {
        const s = await (await fetch('/api/auth-status', { headers: authHeaders() })).json();
        if (!s.authenticated) { localStorage.removeItem(TOKEN_KEY); return showLogin(); }
        document.getElementById('whoami').textContent = s.username ? `(${s.username})` : '';
    } catch (_) { return showLogin(); }
    showApp();
    route();
});
</script>
